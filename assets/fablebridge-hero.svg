    </g>
    <text x="1217" y="137" text-anchor="middle" font-size="18" font-weight="750" fill="#172033">UNIFIED DISCIPLINED</text>
    <text x="1217" y="161" text-anchor="middle" font-size="18" font-weight="750" fill="#172033">WORKFLOW</text>
    <rect x="1192" y="178" width="50" height="3" rx="2" fill="#e97835"/>

    <g>
      <rect x="1114" y="205" width="54" height="54" rx="14" fill="#f5f8ff" stroke="#e3ebfa"/>
      <rect x="1114" y="299" width="54" height="54" rx="14" fill="#fff7f1" stroke="#f9e3d4"/>
      <rect x="1114" y="393" width="54" height="54" rx="14" fill="#f7f4ff" stroke="#e9e1ff"/>
      <rect x="1114" y="487" width="54" height="54" rx="14" fill="#f5f8ff" stroke="#e3ebfa"/>
      <text x="1141" y="240" text-anchor="middle" font-size="24" fill="#3478ea">☷</text>
      <text x="1141" y="334" text-anchor="middle" font-size="24" fill="#e97835">‹/›</text>
      <text x="1141" y="428" text-anchor="middle" font-size="24" fill="#7c5cf6">✓</text>
      <text x="1141" y="522" text-anchor="middle" font-size="24" fill="#3478ea">□</text>
    </g>
    <g fill="#172033" font-size="19" font-weight="650">
      <text x="1190" y="227">Plan</text>
      <text x="1190" y="321">Act</text>
      <text x="1190" y="415">Verify</text>
      <text x="1190" y="509">Learn</text>
    </g>
    <g fill="#667085" font-size="14">
      <text x="1190" y="249">break down &amp; align</text>
      <text x="1190" y="343">edit &amp; execute</text>
      <text x="1190" y="437">test &amp; review</text>
      <text x="1190" y="531">capture outcomes</text>
    </g>
    <g fill="#b7c1d1" font-size="17" text-anchor="middle">
      <text x="1141" y="285">↓</text>
      <text x="1141" y="379">↓</text>
      <text x="1141" y="473">↓</text>
    </g>

    <rect x="505" y="572" width="837" height="68" rx="20" fill="#ffffff" stroke="#e9edf5"/>
    <text x="535" y="600" font-size="16" font-weight="650" fill="#172033">MODEL</text>
    <text x="594" y="600" font-size="16" fill="#98a2b3">→</text>
    <text x="620" y="600" font-size="16" font-weight="650" fill="#172033">CODING AGENT</text>
    <text x="744" y="600" font-size="16" fill="#98a2b3">→</text>
    <text x="770" y="600" font-size="16" font-weight="650" fill="#3478ea">FABLEBRIDGE</text>
    <text x="885" y="600" font-size="16" fill="#98a2b3">→</text>
    <text x="911" y="600" font-size="16" font-weight="650" fill="#172033">YOUR REPOSITORY</text>
    <text x="535" y="624" font-size="13" fill="#7b8799">Kimi, GLM, Qwen, DeepSeek, Claude, GPT and others — wherever your coding agent supports project instructions.</text>
