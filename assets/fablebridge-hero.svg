      <path d="M681 145 C742 145 742 218 812 260" stroke="#62a0f7"/>
      <path d="M681 227 C748 227 755 252 812 276" stroke="#e97835"/>
      <path d="M681 309 C748 309 758 300 812 294" stroke="#8870f5"/>
      <path d="M681 391 C748 391 755 340 812 312" stroke="#4f8df7"/>
      <path d="M681 473 C746 473 747 380 812 330" stroke="#5f91f4"/>
    </g>
    <g fill="#fff" stroke-width="2">
      <circle cx="681" cy="145" r="5" stroke="#62a0f7"/>
      <circle cx="681" cy="227" r="5" stroke="#e97835"/>
      <circle cx="681" cy="309" r="5" stroke="#8870f5"/>
      <circle cx="681" cy="391" r="5" stroke="#4f8df7"/>
      <circle cx="681" cy="473" r="5" stroke="#5f91f4"/>
    </g>

    <g opacity="0.78">
