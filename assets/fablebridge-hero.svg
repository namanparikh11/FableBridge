<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="700" viewBox="0 0 1400 700" role="img" aria-labelledby="title desc">
  <title id="title">FableBridge — portable Fable 5.1-inspired agentic discipline</title>
  <desc id="desc">A light, minimal diagram showing multiple coding agents connected through a Fable 5.1-inspired behavior layer into a disciplined workflow.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="0.58" stop-color="#fbfcff"/>
      <stop offset="1" stop-color="#fff7f0"/>
    </linearGradient>
    <linearGradient id="brand" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#172033"/>
      <stop offset="0.46" stop-color="#2563eb"/>
      <stop offset="1" stop-color="#4f8df7"/>
    </linearGradient>
    <linearGradient id="flow" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#4f8df7"/>
      <stop offset="0.52" stop-color="#7c83f6"/>
      <stop offset="1" stop-color="#e97835"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#172033" flood-opacity="0.08"/>
    </filter>
    <filter id="soft" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="32"/>
    </filter>
  </defs>

  <rect width="1400" height="700" rx="32" fill="url(#bg)"/>
  <circle cx="1210" cy="120" r="150" fill="#ffe8d7" opacity="0.42" filter="url(#soft)"/>
  <circle cx="210" cy="640" r="180" fill="#e8f1ff" opacity="0.55" filter="url(#soft)"/>

  <g font-family="Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">
    <path d="M58 108 C110 56 162 56 214 108" fill="none" stroke="#3b82f6" stroke-width="5" stroke-linecap="round"/>
    <circle cx="58" cy="108" r="6" fill="#3b82f6"/>
    <circle cx="214" cy="108" r="6" fill="#3b82f6"/>
    <path d="M143 55 l4 11 11 4-11 4-4 11-4-11-11-4 11-4z" fill="#ef8a4c"/>

    <text x="58" y="196" font-size="74" font-weight="750" fill="url(#brand)">FableBridge</text>
    <rect x="58" y="218" width="268" height="4" rx="2" fill="url(#flow)"/>

    <text x="58" y="286" font-size="34" font-weight="650" fill="#172033">Make your coding agents</text>
    <text x="58" y="332" font-size="34" font-weight="650" fill="#172033">work more like <tspan fill="#3478ea">Fable 5.1</tspan></text>

    <text x="58" y="382" font-size="20" fill="#55627a">Portable Fable 5.1-inspired agentic discipline for</text>
    <text x="58" y="412" font-size="20" fill="#55627a">Codex, Claude Code, OpenCode, Cursor, and Copilot.</text>

    <g transform="translate(58 454)">
      <circle cx="18" cy="18" r="18" fill="#eef5ff" stroke="#d9e8ff"/>
      <path d="M11 19c0-4 3-7 7-7h5m2 5c0 4-3 7-7 7h-5" fill="none" stroke="#3478ea" stroke-width="2.3" stroke-linecap="round"/>
      <text x="50" y="24" font-size="18" fill="#3478ea">Behavior portability</text>
      <text x="214" y="24" font-size="18" fill="#172033">—</text>
      <text x="236" y="24" font-size="18" fill="#e97835">not model replacement</text>
    </g>

    <g filter="url(#shadow)">
      <rect x="505" y="112" width="176" height="66" rx="16" fill="#fff" stroke="#e8edf5"/>
      <rect x="505" y="194" width="176" height="66" rx="16" fill="#fff" stroke="#e8edf5"/>
      <rect x="505" y="276" width="176" height="66" rx="16" fill="#fff" stroke="#e8edf5"/>
      <rect x="505" y="358" width="176" height="66" rx="16" fill="#fff" stroke="#e8edf5"/>
      <rect x="505" y="440" width="176" height="66" rx="16" fill="#fff" stroke="#e8edf5"/>
