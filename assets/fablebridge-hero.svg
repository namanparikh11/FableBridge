      <path d="M775 299 C842 270 904 270 970 299" fill="none" stroke="#bacdf0" stroke-width="2"/>
      <path d="M872 202 V324" stroke="#76a7f2" stroke-width="3"/>
      <path d="M825 245 L872 202 L920 245" fill="none" stroke="#9bbcf0" stroke-width="1.6"/>
    </g>

    <g filter="url(#shadow)">
      <rect x="802" y="320" width="202" height="164" rx="24" fill="#fff" stroke="#e9edf5"/>
    </g>
    <path d="M851 377 C872 354 893 354 914 377" fill="none" stroke="#3478ea" stroke-width="2.5"/>
    <line x1="882" y1="350" x2="882" y2="397" stroke="#3478ea" stroke-width="2.5"/>
    <text x="903" y="425" text-anchor="middle" font-size="20" font-weight="650" fill="#172033">Fable 5.1-inspired</text>
    <text x="903" y="452" text-anchor="middle" font-size="20" font-weight="650" fill="#172033">behavior layer</text>
    <text x="903" y="477" text-anchor="middle" font-size="22" fill="#e97835">✦</text>

    <g fill="none" stroke="#e97835" stroke-linecap="round" stroke-width="2" opacity="0.78">
      <path d="M984 270 C1040 270 1043 210 1092 210"/>
      <path d="M994 295 C1048 295 1048 304 1092 304"/>
      <path d="M996 321 C1048 321 1048 398 1092 398"/>
      <path d="M980 346 C1037 346 1045 492 1092 492"/>
    </g>

    <g filter="url(#shadow)">
